# Every address and port of the Robot Disco system, once.
# Launch files, nodes and rd_manager load this file (rd_bringup installs it to the share dir and exports
# RD_ROBOT_CONFIG); nothing else types an IP. v1 had the UR's address in 17 code files.
#
# The robot subnet 192.168.11.0/24 is isolated (no internet): the UR, the hand, the robot PC and the GPU
# box sit on it; provisioning needs a second uplink (see provision/README.md).

network:
  subnet: 192.168.11.0/24
  gateway: 192.168.11.1          # only used by nmcli on the Jetson; the subnet has no route out
  dns: 8.8.8.8

robot:                            # the robot PC: Jetson AGX Orin, hostname robotdisco, user rd
  host: robotdisco
  ip: 192.168.11.80
  user: rd
  workspace: /home/rd/RobotDisco  # the colcon workspace (symlink onto the NVMe, see provision/)
  data: /mnt/data                 # NVMe: datasets, checkpoints, evals, maps, galleries
  ports:
    manager: 8092                 # rd_manager: pages + WebSocket (v1: route_editor.py; the teleop page :8090 and
                                  # the Folks page :8096 fold into it)
    infer_server: 8777            # rd_vla inference server, loopback only
    supervisor: 9999              # supervisord web UI / XML-RPC (the manager's Services tab)
    ollama: 11434                 # fallback language model, loopback only
  ros:
    domain_id: 0
    rmw: rmw_cyclonedds_cpp
    cyclonedds_uri: file:///home/rd/RobotDisco/provision/cyclonedds.xml

arm:                              # Universal Robots UR5e, PolyScope 5.21
  ip: 192.168.11.21
  ports:
    dashboard: 29999
    primary: 30001
    secondary: 30002              # raw URScript
    realtime: 30003
    rtde: 30004
    reverse: 50001                # ur_robot_driver external control
    script_sender: 50002
    trajectory: 50003
    script_command: 50004
  tool_voltage: 12                # the hand's ESP32 and servos are fed from the tool connector at 12 V (v1 eval_hw.py TOOL_VOLTAGE,
                                  # confirmed by Bryan 2026-11-10). NEVER 24: nothing sets it today (PolyScope keeps its own 12 V),
                                  # but this is the value anything that does set it will use
  kinematics_file: /mnt/data/ur5e_calibration.yaml   # this arm's factory calibration, used when the file exists (else the nominal
                                  # UR5e, and the driver warns that it does not match). Extract once, arm powered:
                                  #   ros2 launch ur_calibration calibration_correction.launch.py robot_ip:=<arm.ip> target_filename:=/mnt/data/ur5e_calibration.yaml
                                  # then restart rd_base, rd_arm (robot_state_publisher, the driver and MoveIt all read it)
  workspace:                      # where a streamed tool target may not go (policies and teleop), in the UR's base frame;
                                  # v1's calibrate_workspace.py values from the robot (outputs/workspace_calib.json)
    z_floor: -0.2257              # targets below this are lifted to it
    no_go_xy: [-0.233, 0.261, 0.241, 0.279]   # xmin, xmax, ymin, ymax over the robot's body: a target inside is pushed to the nearest edge
    no_go_margin: 0.03
  home: vla_home                  # named pose in rd_arm's pose library that policies start from

hand:                             # AmazingHand, ESP32 on the tool flange (firmware/AmazingHand)
  ip: 192.168.11.117
  ports:
    udp: 8766                     # one "J:" line per datagram; "Q" -> "K:" liveness probe
    tcp: 8765                     # legacy line transport, debugging with nc

panels:                           # WLED controller driving the two LED matrix panels (one segment per panel)
  ip: 192.168.11.218
  ports:
    http: 80                      # JSON API (/json) and the live pixel WebSocket (/ws): the manager's Panels tab
    realtime_udp: 21324           # WLED realtime protocol (DNRGB): the face node's beating heart

gpu:                              # training box: RTX 4090, Ubuntu 24.04, ssh host "GPU"
  host: gpu
  ip: 192.168.11.119
  user: bryan
  workspace: /home/bryan/RobotDisco
  ports:
    manager: 8081                 # rd_manager instance for datasets / training / evals
    ollama: 11434                 # the voice assistant's first-choice local model

battery:                          # the monitor board on the pack: ESP32 + INA228 (firmware/RD_Battery_Monitor), which sends
                                  # {"Voltage","Current","Temperature"} to this PC four times a second
  ports:
    udp: 8889
  current_sign: 1                 # -1 if the shunt is wired so that discharge reads positive (/battery: negative = discharging)
  # The pack's own voltages. Until they are set rd_base's battery_monitor reports volts and amps and warns about nothing.
  full_v: null                    # resting voltage fully charged     } the percentage, linear between the two
  empty_v: null                   # where the pack counts as empty    }
  low_v: null                     # "my battery is low", said once
  critical_v: null                # "please charge me now", repeated every five minutes

sensors:
  velodyne:
    ip: 192.168.11.46
    port: 2368
  rplidar_s1:                     # front, serial over a CP2102; by-id, not ttyUSBn (it re-enumerates after a USB drop)
    serial_port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    baudrate: 256000
    frame: rp_s1_lidar
    # This S1 reads every range too long by an amount that changes between days: +0.33 m on 2026-11-02 (taped box, both
    # scan modes), nothing on 2026-11-10 after a week switched off. So the error is measured on every scan against the
    # drive-wheel housings, which the S1 always sees at a known range, and that is what gets ADDED to every range.
    body_reference:
      sectors_deg: [[-72, -57], [57, 72]]   # scan-frame angles (the scan's own angle_min..angle_max), left then right housing
      ranges_m: [0.367, 0.371]              # their true range: 2026-11-10 with the unit reading true (Velodyne agreed)
    range_offset_m: -0.33         # ADDED to every range only while the reference cannot measure (and if it is removed); 0.0 for a healthy unit
  rplidar_s2e:                    # back, Ethernet (UDP)
    ip: 192.168.11.2
    udp_port: 8089
    frame: rp_s2e_lidar
    scan_mode: DenseBoost
  roboclaw:                       # 2x15A, firmware 4.4.9. Packet serial on the Jetson's 40-pin header since 2026-11-08:
                                  # pin 8 (TX) -> S1, pin 10 (RX) <- S2, pin 6 GND, 3.3 V. The USB jack is mechanically bad
                                  # and its ground reset the Jetson once the board shared a DC-DC with the audio amp.
    port: /dev/ttyTHS1            # serial@3100000 (uarta); on JetPack 6 it needs the PIO device tree (provision.sh jetson)
    baud: 115200                  # the board's packet-serial rate (set and saved with Motion Studio over USB)
    address: 128                  # packet-serial mode 7
    serial_timeout_s: 1.0         # board-side watchdog, saved with Motion Studio: the motors stop 1 s after the link dies
  realsense_d435:
    serial: ""                    # "" = the only one attached
  usb_cameras:                    # three identical UVC webcams, addressed by USB PORT (no serials); one per USB bus
    by_path: /dev/v4l/by-path/platform-3610000.usb-usb-0:{port}:1.0-video-index0   # the Orin's xHCI
    width: 1280
    height: 720
    fps: 30
    image_height: 540             # rows of /cameras/<name>/image after rotation and crop: v1's dataset size (540x540 squares, 960x540 wrist)
    # square: the cut of the upright (rotated) frame the policies were trained on, as a fraction along its long axis
    # (v1's SCENE_SQUARE / SIDE_SQUARE: scene keeps the shelf and the arm's working volume, side keeps Tigger and the
    # upper arm; the wrist is landscape and stays whole). Datasets and checkpoints must agree on these.
    scene: {port: "4.2", rotate: 270, square: 0.40}     # bookshelf straight on, arm entering top-right (a USB-A jack)
    wrist: {port: "1.1", rotate: 0}                     # eye-in-hand, fingers at the top (the VIA dock on USB-C)
    side:  {port: "2.4", rotate: 90, square: 0.30}      # close shelf view with the window at the right (hub on the other USB-C, port 4)

audio:
  sink: alsa_output.usb-C-Media_Electronics_Inc._USB_Audio_Device-00.analog-stereo
  mic: TONOR
  tts_voice: af_heart            # Kokoro-82M

site:                            # where the robot lives: the voice assistant's forecast and its spoken context
  name: "Austin, Texas"
  weather:
    place: Austin                # the name the forecast is spoken with
    latitude: 30.2672            # downtown Austin: city level is all a forecast needs
    longitude: -97.7431

gamepad:                         # the 8BitDo Ultimate 2C; the name and the button numbers go together, per link:
                                 #   Bluetooth:        "8BitDo Ultimate 2C Wireless",            RB 7, LB 6  (measured 2026-11-10)
                                 #   2.4 GHz receiver: "8BitDo Ultimate 2C Wireless Controller", RB 5, LB 4  (kernel xpad, v1 2026-10-31)
  device_name: "8BitDo Ultimate 2C Wireless"
  enable_button: 7               # RB = deadman: nothing drives unless it is held
  enable_turbo_button: 6         # LB = turbo
