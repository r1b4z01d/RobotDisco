# nvblox for the local costmap (Isaac ROS 4.6 names: nvblox_examples_bringup's nvblox_base.yaml is the reference).
# Tuned on the GPU box against Isaac Sim (phase 7); the Orin and the real D435 in phase 8.
nvblox_node:
  ros__parameters:
    global_frame: odom
    pose_frame: base_link
    num_cameras: 1
    voxel_size: 0.05
    use_tf_transforms: true
    use_depth: true
    use_color: false
    use_lidar: false
    mapping_type: static_tsdf
    esdf_mode: "2d"                  # a distance slice for Nav2's nvblox costmap layer
    publish_esdf_distance_slice: true
    integrate_depth_rate_hz: 10.0
    update_esdf_rate_hz: 5.0
    update_mesh_rate_hz: 2.0
    input_qos: SENSOR_DATA           # best effort: receives from the driver and from Isaac Sim alike
    map_clearing_radius_m: 7.0
    map_clearing_frame_id: base_link
    static_mapper:
      projective_integrator_max_integration_distance_m: 4.0
      esdf_integrator_min_weight: 2.0
      esdf_slice_height: 0.5           # the height the 2D slice is evaluated at
      esdf_slice_min_height: 0.1       # obstacles between the deck the lidars miss ...
      esdf_slice_max_height: 1.5       # ... and the top of the arm's reach count
