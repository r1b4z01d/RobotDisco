# nvblox for the local costmap (Isaac ROS 4.6). Tuned on the GPU box / Orin in phases 7-8; these are the
# Isaac Nav2 example's values with the D435's geometry.
nvblox_node:
  ros__parameters:
    global_frame: odom
    pose_frame: base_link
    voxel_size: 0.05
    use_tf_transforms: true
    use_depth: true
    use_color: false
    use_lidar: false
    esdf_mode: 0                     # 2D slice for Nav2
    esdf_slice_height: 0.5
    esdf_2d_min_height: 0.1
    esdf_2d_max_height: 1.5
    mapping_type: static_tsdf
    max_depth_update_hz: 10.0
    publish_esdf_distance_slice: true
    static_mapper:
      projective_integrator_max_integration_distance_m: 4.0
      esdf_integrator_min_weight: 2.0
