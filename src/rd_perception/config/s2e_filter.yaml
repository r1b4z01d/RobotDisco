# /** = any node name: the launch names the chains rp_s1_filter / rp_s2e_filter, and a file keyed on the default
# node name applied nothing (no filters at all; found by the rd_perception sim-mode test, 2026-11-07).
/**:
  ros__parameters:
    HW_ID: none
    filter1:
      name: polygon_filter
      type: laser_filters/LaserScanPolygonFilter
      params:
        polygon_frame: base_link
        # the robot's outline seen from the rear lidar (base_link frame). v1's string lacked the comma after [0.32, -0.32]:
        # laser_filters then parsed no polygon and the S2E body points went through to the costmaps (found by the
        # rd_perception sim-mode test, 2026-11-07).
        polygon: "[[0.32, 0.32], [0.45, 0.25], [0.45, -0.25], [0.32, -0.32], [-0.45, -0.32], [-0.45, -0.1], [-0.6, -0.1], [-0.6, 0.1], [-0.45, 0.1], [-0.45, 0.32]]"
        invert: false
    filter2:
      name: speckle_filter
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 0
        max_range: 2.0
        max_range_difference: 0.1
        filter_window: 3
    