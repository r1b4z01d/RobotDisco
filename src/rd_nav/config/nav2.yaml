# Nav2 (Jazzy, 1.3.x) for Robot Disco. Ported from v1 nav2_params.yaml (Humble) on 2026-11-06:
#  - every cmd_vel is geometry_msgs/TwistStamped (enable_stamped_cmd_vel), to match the base (rd_base)
#  - FollowPath is MPPI (the plan's choice); the v1 DWB tuning is kept as FollowPathDWB for A/B on the robot
#  - the Humble-only keys are gone (bt_navigator plugin list -> Jazzy defaults, local_costmap_*_node blocks)
#  - footprint, lidar sources, keepout filter, planner, behaviours, smoother and limits are v1's
# Frames: map -> odom (AMCL) -> base_footprint (diff_cont). Scans: /rp_s1_lidar/scan_filtered, /rp_s2e_lidar/scan_filtered.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 160
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /rp_s2e_lidar/scan_filtered     # the back lidar, as v1 (/scan was a relay of it)
    set_initial_pose: false                     # the grid localizer / tag corrector / manager set it

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /diff_cont/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml: Jazzy's defaults (replanning + recovery)
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /diff_cont/odom
    enable_stamped_cmd_vel: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathDWB"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 0.5
      ax_min: -0.5
      ay_max: 0.0
      az_max: 3.2
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.26                 # v1's speed limits
      vx_min: -0.1
      vy_max: 0.0
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
    FollowPathDWB:                 # v1's tuned DWB, selectable from a behaviour tree / GoToLandmark goal
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

global_costmap:
  global_costmap:
    ros__parameters:
      # Until someone says where the robot is (the manager's pose tool, a taught tag, the grid localizer) there is no
      # map frame. Jazzy's costmap gives up after 60 s by default, the lifecycle manager then aborts the whole bringup
      # and navigation stays half-started until its unit is restarted (the robot's first boot with the units,
      # 2026-11-10). The value is 158 years, not a day, because the wait is measured on the system clock: after a
      # power loss the Jetson boots in 1970 and chrony steps it 56 years once the network is up, which expired a
      # one-day timeout on the spot, twice that evening. (More than 9.2e9 s would overflow the nanosecond count.)
      initial_transform_timeout: 5000000000.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[[0.32, 0.32], [0.45, 0.25], [0.45, -0.25], [0.32, -0.32], [-0.45, -0.32], [-0.45, -0.1], [-0.6, -0.1], [-0.6, 0.1], [-0.45, 0.1], [-0.45, 0.32]]"
      resolution: 0.05             # v1 planned at 0.01: 25x the cells of the map for no gain on a 0.05 m map
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # The planning map's live obstacles come from the two 2D lidars the map was built with. The Velodyne
        # stays out here (v1, 2026-10-28): it painted the UR arm and a full-height surface across the corridor.
        observation_sources: scan_s2e scan_s1
        footprint_clearing_enabled: true
        scan_s2e:
          topic: /rp_s2e_lidar/scan_filtered
          obstacle_max_range: 3.0
          obstacle_min_range: 0.05
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          max_obstacle_height: 5.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false
        scan_s1:
          topic: /rp_s1_lidar/scan_filtered
          obstacle_max_range: 3.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          max_obstacle_height: 5.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      # as the global costmap's: its wait for odom -> base_footprint is on the system clock too, and a 66 s step at
      # boot (the saved clock catching up with NTP) was past the default 60 s and aborted the bringup (2026-11-10)
      initial_transform_timeout: 5000000000.0
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.32, 0.32], [0.45, 0.25], [0.45, -0.25], [0.32, -0.32], [-0.45, -0.32], [-0.45, -0.1], [-0.6, -0.1], [-0.6, 0.1], [-0.45, 0.1], [-0.45, 0.32]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 2.0
        mark_threshold: 2
        # Every source needs its own key (v1 lost the S2E when both were named `scan`). The Velodyne guards
        # close range here (min range 1.0 m skips the UR arm); rd_perception adds the nvblox layer on the robot.
        observation_sources: scan_s2e scan_s1 pointcloud
        scan_s2e:
          topic: /rp_s2e_lidar/scan_filtered
          obstacle_max_range: 3.0
          obstacle_min_range: 0.05
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          max_obstacle_height: 5.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false
        scan_s1:
          topic: /rp_s1_lidar/scan_filtered
          obstacle_max_range: 3.0
          obstacle_min_range: 0.1
          raytrace_max_range: 10.0
          raytrace_min_range: 0.1
          max_obstacle_height: 5.0
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          inf_is_valid: false
        pointcloud:
          topic: /velodyne_points
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          raytrace_max_range: 25.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 1.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The falloff was v1's 0.1, which is no falloff at all: with this radius every cell within 0.65 m of a wall cost
        # 244 to 251 of 254 (v1 had the same number but only 0.45 m of it), so a 1.1 m doorway was one solid band.
        # At 3.0, the global costmap's value, the cost is 126 at the middle of that doorway. Set live on the robot
        # 2026-11-10 when Bryan found the inflation too heavy; row 6's untested candidate.
        cost_scaling_factor: 3.0
        inflation_radius: 0.65     # >= the footprint's circumscribed radius (0.62): MPPI's CostCritic needs it (v1 DWB ran 0.45)
      always_send_full_costmap: true

# Keepout filter servers: the mask map and the filter info the costmaps' keepout_filter use.
filter_mask_server:
  ros__parameters:
    frame_id: "map"
    topic_name: "/filter_mask"                     # absolute: the costmaps resolve a relative name in THEIR namespace
    # yaml_filename comes from navigation.launch.py (keepout_mask arg)
costmap_filter_info_server:
  ros__parameters:
    type: 0                                        # 0 = keepout
    filter_info_topic: "/costmap_filter_info"
    mask_topic: "/filter_mask"
    base: 0.0
    multiplier: 1.0

map_server:
  ros__parameters:
    yaml_filename: ""                              # set by localization.launch.py (the active map)

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: true
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.4

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 0.5]
    min_velocity: [-0.26, 0.0, -0.5]
    max_accel: [0.5, 0.0, 0.5]
    max_decel: [-0.5, 0.0, -0.5]
    odom_topic: "/diff_cont/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true

collision_monitor:          # lives in rd_base (gates every source); listed here so nav2's lifecycle docs match
  ros__parameters: {}
