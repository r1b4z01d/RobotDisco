# No-go zones for the Nav2 keepout filter, in map metres (the frame of the map named below). Each zone is a
# polygon (any number of vertices, listed in order). Regenerate the mask after editing:
#     rd_keepout                 (writes keepout_mask.pgm / keepout_mask.yaml next to it)
# then restart the navigation unit (the mask server reads the file at startup).
# These three belong to the synthetic demo map; a robot keeps its own beside its own maps ($RD_MAPS_DIR).
map: demo.yaml
zones:
  - name: top_box                      # a block in the upper room
    polygon: [[2.60, 7.25], [6.90, 7.25], [6.90, 9.85], [2.60, 9.85]]
  - name: right_box                    # along the upper room's right wall
    polygon: [[8.70, 5.00], [9.75, 5.00], [9.75, 7.00], [8.70, 7.00]]
  - name: bottom_L                     # an L in the lower left room's far corner
    polygon: [[1.00, -1.90], [5.00, -1.90], [5.00, -0.90], [2.00, -0.90], [2.00, -0.40], [1.00, -0.40]]
