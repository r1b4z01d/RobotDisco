# MoveIt executes through the arm's controller manager under /ur5e. The robot uses the scaled JTC (speed
# slider aware); the rig's mock hardware has no speed scaling, so arm.launch.py spawns the plain JTC there
# and moveit.launch.py marks it default.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  execution_duration_monitoring: false
moveit_simple_controller_manager:
  controller_names:
    - ur5e/scaled_joint_trajectory_controller
    - ur5e/joint_trajectory_controller
  ur5e/scaled_joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints: [ur_shoulder_pan_joint, ur_shoulder_lift_joint, ur_elbow_joint, ur_wrist_1_joint, ur_wrist_2_joint, ur_wrist_3_joint]
  ur5e/joint_trajectory_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: false
    joints: [ur_shoulder_pan_joint, ur_shoulder_lift_joint, ur_elbow_joint, ur_wrist_1_joint, ur_wrist_2_joint, ur_wrist_3_joint]
