# rd_arm's controller manager (namespace /ur5e): the UR driver's controllers with the ur_ joint prefix the
# robot description uses. Jazzy ur_robot_driver 3.9 names (ur_controllers.yaml), minus what the robot does not use.
# Keys are /**/<node>: the nodes live under /ur5e and a bare name would only match the root namespace.
/**/controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    io_and_status_controller:
      type: ur_controllers/GPIOController
    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster
    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    forward_position_controller:
      type: position_controllers/JointGroupPositionController
    ur_configuration_controller:
      type: ur_controllers/URConfigurationController
    freedrive_mode_controller:              # hand-guiding, for teleop recording (rd_arm/freedrive.py switches it in)
      type: ur_controllers/FreedriveModeController
    tcp_pose_broadcaster:
      type: pose_broadcaster/PoseBroadcaster

# The controller manager runs at 500 Hz for the trajectory controller; the joint states do not need to. At 500 Hz
# every Python subscriber (the streamer, the wave server, the policy runner's observer, the manager) spent most of
# a core just receiving them: with all units up the Orin sat at a load average of 42 (2026-11-10).
/**/joint_state_broadcaster:
  ros__parameters:
    update_rate: 100

/**/speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: "ur_"

/**/io_and_status_controller:
  ros__parameters:
    tf_prefix: "ur_"

/**/freedrive_mode_controller:
  ros__parameters:
    tf_prefix: "ur_"

/**/ur_configuration_controller:
  ros__parameters:
    tf_prefix: "ur_"

/**/force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: ur_tcp_fts_sensor
    state_interface_names: [force.x, force.y, force.z, torque.x, torque.y, torque.z]
    frame_id: ur_tool0_controller
    topic_name: ft_data

/**/tcp_pose_broadcaster:
  ros__parameters:
    frame_id: ur_base
    pose_name: ur_tcp_pose
    tf:
      child_frame_id: ur_tool0_controller

/**/joint_trajectory_controller:
  ros__parameters:
    joints: [ur_shoulder_pan_joint, ur_shoulder_lift_joint, ur_elbow_joint, ur_wrist_1_joint, ur_wrist_2_joint, ur_wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }

/**/scaled_joint_trajectory_controller:
  ros__parameters:
    joints: [ur_shoulder_pan_joint, ur_shoulder_lift_joint, ur_elbow_joint, ur_wrist_1_joint, ur_wrist_2_joint, ur_wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      ur_shoulder_pan_joint: { trajectory: 0.2, goal: 0.1 }
      ur_shoulder_lift_joint: { trajectory: 0.2, goal: 0.1 }
      ur_elbow_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_1_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_2_joint: { trajectory: 0.2, goal: 0.1 }
      ur_wrist_3_joint: { trajectory: 0.2, goal: 0.1 }
    speed_scaling_interface_name: ur_speed_scaling/speed_scaling_factor

/**/forward_position_controller:
  ros__parameters:
    joints: [ur_shoulder_pan_joint, ur_shoulder_lift_joint, ur_elbow_joint, ur_wrist_1_joint, ur_wrist_2_joint, ur_wrist_3_joint]
    interface_name: position
