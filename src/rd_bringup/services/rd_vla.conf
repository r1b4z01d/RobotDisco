[program:rd_vla]
; teleop:=false: the arm's gamepad teleop listens on the same /joy as the base. Its button numbers are the
; receiver's (START 7 toggles arm streaming, BACK 6 sends the arm home); over Bluetooth 7 is RB, the base's
; deadman, and 6 is LB, turbo, so driving the base would have moved the arm. Start it by hand for data
; collection (ros2 launch rd_vla vla.launch.py infer_server:=false) once its buttons match the link in use.
command=/usr/bin/env bash -lc "set -a; [ -f /home/rd/.robot_face/voice.env ] && . /home/rd/.robot_face/voice.env; set +a; source /home/rd/RobotDisco/src/rd_bringup/services/common.env && exec ros2 launch rd_vla vla.launch.py infer_server:=false teleop:=false server_unit:=vla_infer_server"
directory=/home/rd/RobotDisco
autostart=true
autorestart=true
startsecs=10
stopsignal=INT
stopwaitsecs=15
stopasgroup=false
killasgroup=true
stdout_logfile=/home/rd/RobotDisco/log/rd_vla.out.log
stderr_logfile=/home/rd/RobotDisco/log/rd_vla.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=HOME="/home/rd",USER="rd"
user=rd
