[program:vla_infer_server]
command=/usr/bin/env bash -lc "set -a; [ -f /home/rd/.robot_face/voice.env ] && . /home/rd/.robot_face/voice.env; set +a; source /home/rd/RobotDisco/src/rd_bringup/services/common.env && exec /opt/vla/bin/python -m rd_vla.infer_server --backend smolvla --device cuda --host 127.0.0.1 --ckpt=$(readlink -f /mnt/data/outputs/serve_ckpt 2>/dev/null || true)"
directory=/home/rd/RobotDisco
autostart=true
autorestart=true
startsecs=20
stopsignal=INT
stopwaitsecs=15
stopasgroup=false
killasgroup=true
stdout_logfile=/home/rd/RobotDisco/log/vla_infer_server.out.log
stderr_logfile=/home/rd/RobotDisco/log/vla_infer_server.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=HOME="/home/rd",USER="rd"
user=rd
