; Plexamp headless: the robot as a Plex music player ("Robot Disco, play music"; also a player in the Plex apps).
; Installed by hand under /mnt/data/plexamp (Node 20 beside it: the headless build wants exactly that) and signed
; in once from a shell:  cd /mnt/data/plexamp/plexamp && ../node/bin/node js/index.js   (claim code from plex.tv/claim)
; Its settings and sign-in live in ~/.local/share/Plexamp. It listens on :32500 (control and its own page).
; SOUND: left to itself ("Default") it opens the Jetson's own APE card, hw:3,0, which has no speaker: it "played"
; in silence (2026-11-15). Its output device is set to the ALSA device `pipewire`, so it plays through the sound
; server to the robot's default sink like everything else, and the robot can still talk over it:
;     printf 'Spipewire' > ~/.local/share/Plexamp/Settings/%40Plexamp%3Asettings%3AaudioDeviceUuid
; autostart=false while datasets are being recorded: start it from the Services tab when music is wanted.
[program:plexamp]
command=/usr/bin/env bash -lc "source /home/rd/RobotDisco/src/rd_bringup/services/common.env; exec /mnt/data/plexamp/node/bin/node /mnt/data/plexamp/plexamp/js/index.js"
directory=/mnt/data/plexamp/plexamp
autostart=false
autorestart=true
startsecs=8
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/RobotDisco/log/plexamp.out.log
stderr_logfile=/home/rd/RobotDisco/log/plexamp.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=HOME="/home/rd",USER="rd",XDG_RUNTIME_DIR="/run/user/1000"
user=rd
