; The manager on the GPU box: datasets, training and evals (no ROS bridge; the robot tabs point at the robot).
; It takes port 8081 from v1's vla_webui, which is switched to autostart=false when this is installed:
;     sudo cp src/rd_bringup/services/gpu/rd_manager.conf /etc/supervisor/conf.d/ && sudo supervisorctl reread && sudo supervisorctl update
; A dataset recorded on the robot is brought here from the Datasets tab (add, from the robot), trained here, and
; its checkpoint pushed back to the robot from the Models tab.
[program:rd_manager]
command=/usr/bin/env bash -lc "set +u; source /opt/ros/jazzy/setup.bash && source /home/bryan/RobotDisco/install/setup.bash && export PYTHONNOUSERSITE=1 RD_ROBOT_CONFIG=/home/bryan/RobotDisco/config/robot.yaml RD_DATA_DIR=/home/bryan/RobotDisco-data && exec /home/bryan/RobotDisco/install/rd_manager/lib/rd_manager/manager --no-ros --port 8081 --data /home/bryan/RobotDisco-data"
directory=/home/bryan/RobotDisco
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=15
stopasgroup=false
killasgroup=true
stdout_logfile=/home/bryan/RobotDisco/log/rd_manager.out.log
stderr_logfile=/home/bryan/RobotDisco/log/rd_manager.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
environment=HOME="/home/bryan",USER="bryan"
user=bryan
