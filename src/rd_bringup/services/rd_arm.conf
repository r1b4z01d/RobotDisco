[program:rd_arm]
command=/usr/bin/env bash -lc "set -a; [ -f /home/rd/.robot_face/voice.env ] && . /home/rd/.robot_face/voice.env; set +a; source /home/rd/RobotDisco/src/rd_bringup/services/common.env && ros2 launch rd_arm arm.launch.py"
directory=/home/rd/RobotDisco
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/RobotDisco/log/rd_arm.out.log
stderr_logfile=/home/rd/RobotDisco/log/rd_arm.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=HOME="/home/rd",USER="rd"
user=rd
