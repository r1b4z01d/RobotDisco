[program:ollama]
; The voice assistant's fallback language model on the robot (the GPU box's is asked first). Loopback only.
command=/usr/local/bin/ollama serve
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/home/rd/RobotDisco/log/ollama.out.log
stderr_logfile=/home/rd/RobotDisco/log/ollama.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=HOME="/usr/share/ollama",OLLAMA_HOST="127.0.0.1:11434",OLLAMA_KEEP_ALIVE="30m",OLLAMA_MODELS="/mnt/data/ollama"
user=ollama
