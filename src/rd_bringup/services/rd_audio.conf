[program:rd_audio]
command=/usr/bin/env bash -lc "set -a; [ -f /home/rd/.robot_face/voice.env ] && . /home/rd/.robot_face/voice.env; set +a; source /home/rd/RobotDisco/src/rd_bringup/services/common.env && exec ros2 launch rd_audio audio.launch.py"
directory=/home/rd/RobotDisco
autostart=true
autorestart=true
startsecs=5
stopsignal=INT
stopwaitsecs=15
stopasgroup=false
killasgroup=true
stdout_logfile=/home/rd/RobotDisco/log/rd_audio.out.log
stderr_logfile=/home/rd/RobotDisco/log/rd_audio.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=2
environment=HOME="/home/rd",USER="rd"
user=rd
